# terra configuration — copy to ~/.terra/config.toml
#
# Every key is optional; anything you leave out keeps its default. Unknown
# keys are ignored and reported as warnings, and a broken file never stops
# terra from starting — it just falls back to the defaults.
#
# Set TERRA_CONFIG to load a different file.

[font]
# Terminal font size in points. 6.0 – 72.0.
size = 15.0

# Cell height multiplier, the equivalent of Ghostty's `adjust-cell-height`.
# 0.5 – 3.0.
line_height = 1.3

[tabs]
# Show a small icon on each tab, to the left of its title, for whatever the tab
# is running: claude, codex, opencode, fish, pwsh, python, node, docker, git,
# htop, vim, neovim, tmux, cargo. Anything else — including a plain zsh, bash,
# sh or dash prompt, which is furniture rather than an identity — gets a dim
# `>_`, so the titles in a row stay aligned instead of shifting as programs come
# and go.
#
# Icons keep their brand colour — recognising a logo at a glance is the point —
# except the generic `>_`, which is tinted to the tab's own text colour.
#
# terra works out what to draw the same way it works out `text.bidi_quirks`
# below: by walking the process tree down from the tab's shell to whatever is
# actually running in it, about once a second. It also reads that process's
# arguments, so a CLI that runs as a script under an interpreter (`codex` is a
# node script) is recognised as itself rather than as node. Failing that (or
# before the first walk on a brand-new tab) it falls back to matching whole
# words in the tab's title and the command it was opened with.
#
# Set this to false if you would rather terra not read the process table at
# all, or simply find logos in chrome noisy. Off skips the poll too, not just
# the drawing.
icons = true

# Show the tab bar when there is only one tab open.
#
# On by default: the bar carries the tab's title, the + button and the ⌄ profile
# menu, and a window that grows its chrome only once you own a second tab both
# hides the way to open one and shifts the terminal down by the bar's height the
# moment you do.
#
# Set this to false for a bare single-tab window — Ghostty's behaviour, and
# terra's before this key existed. The bar comes back the moment there is a
# second tab; a split always shows every group's bar either way, since two
# unlabelled columns are indistinguishable.
bar_with_one_tab = true

# Kilobytes of raw terminal output kept per tab, for `terra transcript <tab>`.
#
# `terra capture` reads the terminal's grid, which is why it comes back empty
# for a full-screen program: Claude Code, htop and less paint on the *alternate
# screen*, that screen has no scrollback by definition, and when the program
# clears or exits nothing of it is left anywhere. terra saw the bytes, though —
# they arrived through it — so it keeps the last few hundred kilobytes of them
# per tab and `terra transcript` reads them back, escape sequences stripped.
#
# In memory only. A transcript is never written to disk, never logged, and dies
# with its tab; the only way out is the same 0700 socket as every other command.
#
# The buffer is allocated on a tab's first byte of output, not when the tab is
# created, and then overwrites oldest-first — so the cost is bounded at this
# many kilobytes per tab that has actually printed something, and idle tabs
# cost nothing. The default is a few hundred repaints of a full-screen app, or
# tens of thousands of lines of ordinary shell output.
#
# Set this to 0 to switch transcripts off entirely: no buffer is allocated, the
# bytes are not copied at all, and `terra transcript` answers with an error
# saying so. Changing it takes effect for tabs opened afterwards — an open tab
# keeps the buffer it was created with rather than losing what it recorded.
# Capped at 65536 (64 MB per tab).
transcript_kb = 512

[text]
# Reorder right-to-left text (Hebrew, Arabic, …) for display, per the Unicode
# Bidirectional Algorithm, UAX #9: https://unicode.org/reports/tr9/
#
#   "off"  — never reorder (default). What every other terminal does.
#   "on"   — always reorder.
#   "auto" — decide per tab from [text.bidi_quirks] below, using the program
#            running in it. Anything not listed there is treated as "off".
#
# With this off, RTL text is painted exactly as the program sent it. With it
# on, each row is reordered for display while the buffer, the clipboard and
# any URL matching stay in logical order.
#
# The default is "off" because reordering is only correct for programs that
# send *logical* order and leave the reordering to the terminal. A program
# that runs its own BiDi and sends visual order gets double-reversed into
# nonsense if the terminal reorders too — and, as below, the terminal cannot
# tell the two apart. "off" is the answer that never corrupts anything.
#
# Note this is BiDi *level 1*: reordering and bracket mirroring, no Arabic
# contextual shaping. Hebrew reads correctly; Arabic is ordered correctly but
# renders as isolated letterforms.
#
# Toggle at runtime with ⌘⇧B, or "Toggle RTL Text Reordering" in the command
# palette (⌘⇧P). Runtime toggles last for the session and are not written
# back to this file.
bidi = "off"

# The paragraph direction each row is resolved against.
#
#   "auto" — detect per row with UAX #9 rules P2/P3 (default)
#   "ltr"  — always left-to-right
#   "rtl"  — always right-to-left
#
# "auto" is what puts sentence-final punctuation on the correct side: under
# "ltr" the `?` of `היי מה קורה?` resolves to the paragraph level and is
# stranded on the visual right. It does not move a shell prompt, because P2
# stops at the first strong character — the `t` of `terra` in
# `→ terra git:(main) ✗ …`.
#
# Detection runs over each row's non-blank prefix only. Including the row's
# trailing padding would drag it into the reversed run and push a four-letter
# Hebrew word out to column 76 of an 80-column terminal.
#
# Cycle at runtime from the command palette.
bidi_base = "auto"

# Per-application overrides, consulted when bidi = "auto".
#
# This table exists because the choice is undecidable from the byte stream.
# A terminal receives one sequence of characters, and UAX #9 gives logical
# order and visual order the *same* representation — there is no marker, no
# heuristic, and no amount of looking at the text that distinguishes "please
# reorder this" from "I already did". Only the program at the other end knows,
# so terra keys the decision on which program is running in the tab.
#
# It is a compatibility table, not language detection: nothing here inspects
# the text, and adding a program says nothing about what languages it prints.
#
# Keys are the command's basename, matched case-insensitively. Values are the
# same "off" / "on" / "auto" as `bidi` above. Your entries are merged over the
# ones terra ships, key by key, so listing one program keeps the rest.
[text.bidi_quirks]
# Runs its own bidirectional algorithm and emits visual order; reordering it
# again would reverse it back to mirrored.
claude = "off"
# Emits logical order and expects the terminal to reorder.
codex = "on"

# ---------------------------------------------------------------------------
# Profiles — named ways to open a tab
# ---------------------------------------------------------------------------
#
# Each [profile.<name>] adds one entry to the ⌄ menu next to the tab bar's +
# button, one command-palette action ("New Tab: <name>", id tab.new.<name>),
# and one CLI spelling: `terra new --profile <name>`.
#
# Every key is optional:
#
#   command — what to run, written as you would type it. It is split into
#             words the way a shell splits a command line ('…' and "…" group
#             words), and then run exactly as `terra new -- …` runs a command:
#             typed into your normal login shell, so your prompt renders, the
#             command line is visible in the scrollback, and the shell is
#             still there when the program exits. Omit it for a plain shell.
#   cwd     — where the tab starts. A leading ~ is expanded.
#   title   — the tab's title, which the shell can no longer change.
#
# A profile that is malformed — a `command` with an unterminated quote, a key
# of the wrong type — is skipped with a warning; the other profiles are
# unaffected. `terra new --profile` with a name that is not here fails with an
# error listing the names that are, rather than quietly opening a shell.
#
# These are examples; delete them.

[profile.htop]
command = "htop"
title = "system"

[profile.logs]
command = "tail -f /var/log/system.log"
cwd = "~"
title = "logs"

[profile.home]
# No command at all: just a shell, over there.
cwd = "~"
