# Vendored from https://github.com/Harzu/egui_term @ 31bbc7ab8503 (MIT)
# with terra patches — see PATCHES.md.
[package]
name = "egui_term"
description = "Terminal emulator widget powered by EGUI framework and alacritty terminal backend."
authors = ["Ilya Shvyryalkin <ilyashvy@gmail.com>"]
version = "0.1.0"
edition = "2021"
repository = "https://github.com/Harzu/egui_term"
license = "MIT"

[dependencies]
egui = { workspace = true }
alacritty_terminal = "0.26"
anyhow = "1"
# terra patch: `EventedReadWrite`'s register/reregister take polling types, so
# wrapping a PTY (src/backend/tap.rs) means naming them. Same version
# alacritty_terminal already depends on — no extra crate, no extra build.
polling = "3.8"
open = "5.3.2"
# terra patch: UAX #9 BiDi reordering (see src/bidi.rs).
unicode-bidi = "0.3"
# terra patch (#19): colour emoji from the system font's sbix bitmaps.
skrifa = "0.45"
png = "0.17"
