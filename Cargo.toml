[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
egui = "0.35"
# x11 + wayland are no-ops off Linux (winit gates them on the target), but
# without them winit's Linux backend is a hard `compile_error!`, so a bare
# `cargo build --workspace` on Linux fails before it reaches any terra code.
eframe = { version = "0.35", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "x11",
    "wayland",
] }
egui_term = { path = "vendor/egui_term" }
toml = "0.9"
alacritty_terminal = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"

# macOS titlebar proxy icon (see crates/terra-app/src/macos.rs). Versions match
# what winit/eframe already pull in, so this costs no extra build.
raw-window-handle = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSResponder",
    "NSView",
    "NSWindow",
    "NSApplication",
    "NSRunningApplication",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSString",
] }

# One `sysctl(KERN_PROC_ALL)` to find the program running in a tab (see
# crates/terra-app/src/procinfo.rs). Already in the tree via winit/eframe, so
# depending on it directly costs no extra build.
libc = "0.2"

terra-protocol = { path = "crates/terra-protocol" }
terra-palette = { path = "crates/terra-palette" }

[profile.release]
opt-level = 2
