[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
egui = "0.35"
# x11 + wayland are no-ops off Linux (winit gates them on the target), but
# without them winit's Linux backend is a hard `compile_error!`, so a bare
# `cargo build --workspace` on Linux fails before it reaches any terra code.
eframe = { version = "0.35", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "x11",
    "wayland",
] }
egui_term = { path = "vendor/egui_term" }
toml = "0.9"
alacritty_terminal = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# Cross-platform local sockets: Unix domain sockets on Unix, named pipes on
# Windows, behind one synchronous API (crates/terra-protocol). Pinned exactly:
# it is a single-maintainer crate and the transport is the CLI's only way in.
# 2.4.3's diff against the 2-million-download 2.4.2 is doc comments plus one
# `&self.details` -> `self.details`, so it is that release's field exposure with
# 2.4.1's fix for the crash on reading a disconnected Windows pipe. The `tokio`
# feature is deliberately left off — terra has no async runtime.
interprocess = "=2.4.3"
clap = { version = "4", features = ["derive"] }

# `terra screenshot`: the app encodes the framebuffer, the CLI decodes it again
# to composite `--pretty`. Both crates are already in the tree at these exact
# versions (png via eframe/arboard's `image`, base64 via alacritty_terminal),
# so naming them adds no lockfile entry and no extra compilation. png is a
# codec, not an image framework — no colour management, no resizing, no formats
# terra does not use.
png = "0.18"
base64 = "0.22"
log = "0.4"
env_logger = "0.11"

# macOS titlebar proxy icon (see crates/terra-app/src/macos.rs). Versions match
# what winit/eframe already pull in, so this costs no extra build.
raw-window-handle = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSResponder",
    "NSView",
    "NSWindow",
    "NSApplication",
    "NSRunningApplication",
    # The window's open/close transition: `NSAnimationContext` + the
    # `animator()` proxy from `NSAnimation`, with the easing curve coming from
    # QuartzCore (hence the `objc2-quartz-core` bridge feature).
    "NSAnimation",
    "NSAnimationContext",
    "objc2-quartz-core",
    # `NSWindow.alphaValue` and `frame` are CGFloat/CGRect, which live behind
    # the CoreFoundation bridge feature.
    "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSString",
    "NSGeometry",
] }
# Just `CAMediaTimingFunction`, for the ease-in/ease-out curves the window
# transition runs on. Already in the tree via winit, so this costs no build.
objc2-quartz-core = { version = "0.3", default-features = false, features = [
    "std",
    "CAMediaTimingFunction",
] }

# One `sysctl(KERN_PROC_ALL)` to find the program running in a tab (see
# crates/terra-app/src/procinfo.rs). Already in the tree via winit/eframe, so
# depending on it directly costs no extra build.
libc = "0.2"

terra-protocol = { path = "crates/terra-protocol" }
terra-palette = { path = "crates/terra-palette" }

[profile.release]
opt-level = 2
