# Tagged release: build macOS, Linux and Windows artifacts and publish them on
# a GitHub Release. See docs/RELEASING.md for how it works and how to run the
# build scripts locally; docs/SIGNING.md for enabling signing.
name: release

on:
  push:
    tags:
      - "v*"
  # Rehearse the whole thing (build + package, no publish) by hand.
  workflow_dispatch:

# The default GITHUB_TOKEN is read-only; creating a release needs write.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Keep in sync with [package.metadata.packager.macos] minimum-system-version.
  MACOSX_DEPLOYMENT_TARGET: "11.0"
  # Load-bearing: cargo-packager skips create-dmg's AppleScript styling when set.
  CI: "true"

jobs:
  build:
    name: ${{ matrix.name }}
    # Runners are pinned so a re-run of an old tag cannot silently change what
    # it produces.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            platform: macos
            runner: macos-15
            artifact: macos-universal
            targets: aarch64-apple-darwin, x86_64-apple-darwin
            files: |
              dist/terra-macos-universal.dmg
              dist/terra-cli-macos-universal.tar.gz
              dist/terra-macos-universal.app.tar.gz
            release_notes: true
          - name: Linux (x86_64)
            platform: linux
            runner: ubuntu-22.04
            artifact: linux-x86_64
            files: |
              dist/terra-linux-x86_64.tar.gz
              dist/terra-linux-x86_64.deb
            release_notes: false
          - name: Windows (x86_64)
            platform: windows
            runner: windows-2022
            artifact: windows-x86_64
            files: |
              dist/terra-windows-x86_64.zip
              dist/terra-windows-x86_64-setup.exe
            release_notes: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      # egui/eframe/wgpu is a big tree; without this the job just recompiles it.
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.platform }}

      - uses: astral-sh/setup-uv@v5

      # eframe's documented Linux requirements, same list as ci.yml.
      - name: Install Linux GUI build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev

      # Pinned: the .app layout and dmg behaviour were verified against this one.
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked --version 0.11.8

      # A tag that ships a broken build is worse than a failed workflow.
      - name: Test
        run: cargo test --workspace

      # Signing is opt-in and decided inside the script from the environment.
      - name: Build and package
        run: uv run scripts/release/build.py ${{ matrix.platform }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGN_TUNNEL_URL: ${{ secrets.SIGN_TUNNEL_URL }}
          SIGN_TUNNEL_SECRET: ${{ secrets.SIGN_TUNNEL_SECRET }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

      # Every published filename is listed in the matrix above; that is the only
      # place to edit if one changes.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: ${{ matrix.release_notes }}
          fail_on_unmatched_files: true
          files: ${{ matrix.files }}

  # Appends the platform-support statement to the generated release notes.
  # `append_body` is not idempotent: re-running a tag appends a second copy,
  # which is a visible, harmless duplicate — delete it in the release UI.
  support-notes:
    name: Release notes (platform support)
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          append_body: true
          body: |
            ## Platform support

            **macOS — tested.** This is terra's development and v1 target. The
            `.dmg` and the `.app` inside it are ad-hoc signed, not notarised, so
            Gatekeeper shows the unidentified-developer prompt on first launch:
            right-click the app and choose Open.

            **Linux (x86_64) and Windows (x86_64) — build-verified only.** The
            installers (`.deb`, `-setup.exe`) and archives compile, pass the
            test suite and pass clippy in CI, but the GUI has had far less
            real-world use than on macOS. Bug reports welcome. The Windows
            installer is unsigned, so SmartScreen will warn on first run —
            choose "More info" → "Run anyway".

            Each plain archive contains two binaries — `terra-app` (the GUI) and
            `terra` (the CLI, needed for `terra ls`, `terra new`, `terra learn`).
            Put both somewhere on your `PATH`.
