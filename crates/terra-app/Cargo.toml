[package]
name = "terra-app"
version.workspace = true
edition.workspace = true
license.workspace = true
# Shown by the OS installers (deb control file, msi/nsis metadata). The GUI
# binary stays terra-app; "Terra" is the product name users see.
description = "Terra — a terminal your agents can drive"

[[bin]]
name = "terra-app"
path = "src/main.rs"

# build.rs embeds assets/icon/terra.ico into the .exe (see the script's doc
# comment). winresource is a no-op on every non-Windows target, so this costs
# the mac/linux builds nothing.
[build-dependencies]
winresource = "0.1"

[dependencies]
egui = { workspace = true }
eframe = { workspace = true }
egui_term = { workspace = true }
alacritty_terminal = { workspace = true }
terra-protocol = { workspace = true }
interprocess = { workspace = true }
terra-palette = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
raw-window-handle = { workspace = true }

# `terra screenshot`: encodes the framebuffer egui hands back. Already built
# for this crate (eframe -> arboard -> image -> png), so it is free here.
png = { workspace = true }

# eframe is pulled in with `default-features = false` (see the workspace
# manifest), which leaves winit with no windowing backend on Linux — it fails
# to compile with "the platform you're compiling for is not supported".
# Features are additive across the graph, so asking for them here is enough and
# costs nothing on the other platforms.

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-app-kit = { workspace = true }
objc2-foundation = { workspace = true }
objc2-quartz-core = { workspace = true }
winit = { workspace = true }
libc = { workspace = true }

# ToolHelp32, to find the program running in a tab (see
# crates/terra-app/src/procinfo.rs) — the Windows counterpart of the `libc`
# dependency above. Already in the tree at this version via alacritty_terminal's
# ConPTY backend, and features are additive across the graph, so naming it here
# adds no crate and no extra compilation. Only the two feature groups the
# snapshot walk needs are enabled, plus Threading for the `CreateMutexW` that
# backs single-instance detection (see src/ipc.rs).
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
] }

# `cargo packager -p terra-app --release` — cross-platform bundles
# (.app/.dmg on macOS, nsis/msi on Windows, deb/appimage on Linux).
[package.metadata.packager]
product-name = "Terra"
identifier = "dev.terra.app"
# no `version` here on purpose — cargo-packager inherits [package] version,
# which is workspace-inherited. Typing it twice lets the bundle and the binary
# disagree, which would break an updater in both directions.
category = "DeveloperTool"
# The installers are the only artifacts now, so both binaries have to be inside
# them. cargo-packager auto-detects only the bin targets of *this* crate, which
# is `terra-app` alone; listing them explicitly adds the `terra` CLI (built by
# terra-cli into the same target directory) to Terra.app/Contents/MacOS, to the
# .deb's /usr/bin and to the NSIS install directory. `main = true` is what picks
# the .app's CFBundleExecutable and the installer's launch target.
# The order here does not reach cargo-packager: it sorts its sign targets by
# path depth alone (`impl Ord for SignTarget`, src/codesign/macos.rs), so two
# binaries in Contents/MacOS tie and come out of the BinaryHeap in whatever
# order it likes. Signing the *main* executable makes codesign validate the
# whole bundle, so an unsigned sibling fails the run half the time —
# scripts/release/build.py signs the CLI before packaging to close that.
binaries = [
  { path = "terra-app", main = true },
  { path = "terra" },
]
icons = [
  "assets/icon/terra.icns",
  "assets/icon/terra.ico",
  "assets/icon/terra-256.png",
  "assets/icon/terra-512.png",
]
# The default formats for a bare `cargo packager` run (i.e. `just bundle` on a
# Mac). CI overrides per platform with `--formats` — nsis on Windows, deb on
# Linux (see .github/workflows/release.yml).
formats = ["app", "dmg"]

[package.metadata.packager.macos]
minimum-system-version = "11.0"
# cargo-packager signs the bundle itself, inside-out (every Mach-O first, then
# the .app), and notarises when APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID are in the
# environment — but only if an identity is configured here. There is no
# APPLE_SIGNING_IDENTITY fallback in 0.11.8 (see src/package/app/mod.rs and
# src/codesign/macos.rs), so "-" is the checked-in default: an ad-hoc signature,
# exactly what an unsigned release has always shipped. For a real release
# scripts/release/build.py swaps this one line for $APPLE_SIGNING_IDENTITY and
# puts it back afterwards.
signing-identity = "-"

# Without this the setup.exe wears NSIS's default icon; the app itself already
# gets terra.ico via `icons` above. (The dmg's volume icon needs nothing — the
# packager derives an .icns from `icons` and passes --volicon itself.)
[package.metadata.packager.nsis]
installer-icon = "assets/icon/terra.ico"

[package.metadata.packager.windows]
# %1 is the file cargo-packager wants signed. It applies this to the main
# binary, the uninstaller (via NSIS `!uninstfinalize`, from a different working
# directory) and the finished installer, so the command has to resolve from
# anywhere: build.py drops terra-sign.cmd — a one-line shim around
# scripts/release/sign_client.py — into a directory it prepends to PATH.
# The shim exits 0 without touching the file when SIGN_TUNNEL_URL /
# SIGN_TUNNEL_SECRET are unset, which is how a secretless run stays unsigned.
sign-command = "terra-sign.cmd %1"
